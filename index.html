<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PHANTOM SHIFT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d16;
        color: #e6f6ff;
        font-family: "Noto Sans JP", sans-serif;
        overflow: hidden;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      #orientation-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 18, 0.92);
        z-index: 10;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        font-size: 20px;
      }
      #orientation-overlay span {
        display: inline-block;
        padding: 18px 24px;
        border: 1px solid #4dd0ff;
        border-radius: 12px;
        background: rgba(14, 18, 30, 0.8);
        box-shadow: 0 0 20px rgba(77, 208, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="orientation-overlay"><span>横向き推奨<br />端末を横向きにしてください</span></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
